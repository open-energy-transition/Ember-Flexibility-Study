run:
  name: scenario_2030_flex_off

scenario:
  clusters:
  - 39
  sector_opts:
  - 3H
  planning_horizons:
  - 2030

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR', 'GB', 'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'ME', 'MK', 'NL', 'NO', 'PL', 'PT', 'RO', 'RS', 'SE', 'SI', 'SK'] #, 'XK']

snapshots:
  start: '2023-01-01'
  end: '2024-01-01'

electricity:
  conventional_generation:
    from_entsoe: false
    year: 2030

  max_hours:
    home_battery: 2.5

  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []

  transmission_limit: v1.0

  custom_powerplants: true
  custom_powerplants_fn: "data/custom_ppl_2030.csv"
  powerplants_filter: Fueltype in ['Remove everything']

  estimate_renewable_capacities:
    enable: false
    from_gem: false

atlite:
  default_cutout: europe-2023-sarah3-era5
  show_progress: true
  cutouts:
    europe-2023-sarah3-era5:
      module: [sarah, era5] # in priority order
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2023', '2023']

renewable:
  onwind:
    correction_factor: 0.93
  solar:
    correction_factor: 0.854337

lines:
  s_max_pu: 1

links:
  under_construction: remove
  max_extension: 0

transmission_projects:
  enable: false

pypsa_eur:
  Generator:
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - solar-hsat
  - solar
  - ror
  - solar-rooftop
  StorageUnit:
  - PHS
  - hydro
  - battery
  - home_battery_storage

sector:
  transport: true
  heating: true
  biomass: true
  industry: true
  shipping: false
  aviation: false
  agriculture: false
  gas_network: false
  bev_dsm: false
  v2g: 0
  land_transport_electric_share:
    2030: "data/ember_data/land_transport_electric_share_2030.csv"
  land_transport_ice_share:
    2030: "data/ember_data/land_transport_ice_share_2030.csv"
  bev_dsm_availability: 0.15
  bev_energy: 0.8
  bev_charge_efficiency: 0.9
  bev_charge_rate: 0.0449
  bev_avail_max: 0.95
  bev_avail_mean: 0.8
  bev_dsm_restriction_value: 0.5
  bev_dsm_restriction_time: 7
  transport_electric_efficiency: 53.19
  conventional_generation:
    OCGT: gas
    CCGT: gas
    coal: coal
    lignite: lignite
    nuclear: uranium
    oil: oil
  keep_existing_capacities: true

costs:
  year: 2030
  fuel:
    gas: 19.9
    coal: 10.7
    lignite: 8.5
    oil: 28.2
    uranium: 1.8
  VOM:
    OCGT: 1
    CCGT: 1
    coal: 2.3
    lignite: 2.3
  emission_prices:
    enable: true
    co2: 69.6
  
clustering:
  exclude_carriers:
  - coal
  - nuclear
  - lignite

simplify_network:
  remove_stubs_across_borders: true

ember_settings:
  ntc_data: "data/ember_data/ntc_2030.csv"
  ntc_cross_country_pf_restriction: false
  ramping: false
  nuclear_decommissioning: false
  ember_gas_price: true
  hourly_carbon_prices: false
  chp_countries:
    Poland: PL
    Czechia: CZ
    Greece: GR
    Germany: DE
    Italy: IT
    Netherlands: NL
  filter_chps: "DateIn <= 2030 and DateOut >= 2030 and type == 'chp' and status == 'operating' and bus in @focus_full"
  chp_data: "data/ember_data/combined_chp_2030.csv"
  add_LV_capacities: true
