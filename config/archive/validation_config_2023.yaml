run:
  name: validation_2023

scenario:
  clusters:
  - 39
  opts:
  - ''
  sector_opts:
  - '3H'
  planning_horizons:
  - 2025

snapshots:
  start: "2023-01-01"
  end:   "2024-01-01"

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR', 'GB', 'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'ME', 'MK', 'NL', 'NO', 'PL', 'PT', 'RO', 'RS', 'SE', 'SI', 'SK'] #, 'XK']

atlite:
  cutout_directory: cutouts
  default_cutout: europe-2023-sarah3-era5
  nprocesses: 4
  show_progress: true
  cutouts:
    # use 'base' to determine geographical bounds and time span from config
    # base:
      # module: era5
    europe-2023-sarah3-era5:
      module: [sarah, era5] # in priority order
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2023', '2023']

pypsa_eur:
  Generator:
  - onwind
  - offwind-ac
  - offwind-dc
  - offwind-float
  - solar-hsat
  - solar
  - ror

electricity:
  custom_powerplants: true
  custom_powerplants_fn: data/custom_powerplants.csv
  powerplants_filter: (Fueltype not in ['Nuclear', 'Hard Coal', 'Lignite', 'Natural Gas'] and DateIn <= 2023 and DateOut >= 2023)

  estimate_renewable_capacities:
    enable: true
    from_gem: false
    year: 2023
    expansion_limit: false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

load:
  manual_adjustments: false

costs:
  year: 2025
  fuel:
    gas: 40.45 # (Avg TTF DA 2023 contracts)
    coal: 16.71 # (from Avg M1 API2 2023 contracts)
    lignite: 7.7 #  (from IEEFA paper)
    oil: 46.8 # (Brent Crude CAL 2023)
  VOM:
    OCGT: 1
    CCGT: 1
    coal: 2.3
    lignite: 2.3
  emission_prices:
    enable: true
    co2: 80

clustering:
  exclude_carriers: [coal, nuclear, lignite]
#  focus_weights: {'DE': 0.2, 'CZ': 0.06, 'PL': 0.1, 'NL': 0.05, 'IT': 0.15, 'GR': 0.05}

ember_settings:
  ntc_data: "data/ember_data/ntc_2030.csv"
  ntc_cross_country_pf_restriction: false
  ramping: false
  nuclear_decommissioning: true
  ember_gas_price: true
  hourly_carbon_prices: false
  hourly_price_fix: true # True will remove gas, coal and lignite Stores
  historical_ntc: true
  chp_countries:
    Poland: PL
    Czechia: CZ
    Greece: GR
    Germany: DE
    Italy: IT
    Netherlands: NL
  chp_data: "data/ember_data/combined_chp_2023.csv"
